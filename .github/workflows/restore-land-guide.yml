name: Restore land area guide
on:
  push:
    paths:
      - '.github/workflows/restore-land-guide.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact uploaded HTML
        shell: bash
        run: |
          printf '%s' \
          '' \
          '' \
          '' \
          '' \
          '' \
          '' \
          | base64 -d | gzip -d > demos/land-area-guide/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/land-area-guide/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: restore original land area guide"
          git push
